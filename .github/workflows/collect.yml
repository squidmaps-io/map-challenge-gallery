name: Collect

# Every 6 hours: pick up new and late #30DayMapChallenge posts from Bluesky and Mastodon,
# commit any changes and redeploy. Once a day (the 06:17 UTC run, and manual runs) it also
# re-checks stored posts for deletions and opt-outs; that pass makes a request per post, so it
# runs daily to go easy on small Mastodon servers.
# After the challenge (early December) disable this workflow, or reduce it to a weekly re-check.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC: collect + re-check
    - cron: '17 0,12,18 * * *' # every other 6 hours: collect only
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect recent days
        run: npm run collect -- --recent 3
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - name: Re-check stored posts (daily)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        run: npm run recheck
      - name: Commit changes
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Collect posts $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with the workflow token don't trigger other workflows, so deploy from here.
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
